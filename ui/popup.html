<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lexis</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="popup-header">
      <h1>Lexis</h1>
    </div>

    <!-- Tab Navigation -->
    <div class="popup-tabs">
      <button class="popup-tab active" data-tab="flashcards">
        <img src="icons/book-marked.svg" alt="Flashcards">
        <span>Flashcards</span>
        <span class="tab-count" id="flashcardCount">0</span>
      </button>
      <button class="popup-tab" data-tab="highlights">
        <img src="icons/notebook-pen.svg" alt="Notes">
        <span>Notes</span>
        <span class="tab-count" id="highlightsCount">0</span>
      </button>
    </div>

    <!-- Tab Contents -->
    <div class="popup-content">
      <!-- Flashcards List -->
      <div class="tab-panel active" id="flashcardsPanel">
        <div class="panel-header">
          <h3>Recent Flashcards</h3>
          <button class="open-fullpage-btn" id="openFlashcardsFullpage" title="Open in full page">
            <img src="icons/external-link.svg" alt="Open in full page">
          </button>
        </div>
        <!-- Preview card (shown after creation) -->
        <div id="previewCard" class="preview-card hidden">
          <div class="preview-card-header">
            <span class="preview-card-label">— Just created</span>
            <button id="closePreviewCard" class="preview-close-btn">×</button>
          </div>
          <div class="preview-card-word" id="previewWord"></div>
          <div class="preview-card-pos" id="previewPos"></div>
          <div class="preview-card-definition" id="previewDefinition"></div>
          <div class="preview-card-example" id="previewExample"></div>
        </div>
        <div class="items-list" id="flashcardsList">
          <!-- Flashcards will be rendered here -->
        </div>
        <div class="empty-state hidden" id="flashcardsEmpty">
          <img src="icons/book-open.svg" alt="">
          <p>No flashcards yet</p>
          <small>Highlight text to create one</small>
        </div>
      </div>

      <!-- Highlights List -->
      <div class="tab-panel" id="highlightsPanel">
        <div class="panel-header">
          <h3>Recent Highlights</h3>
          <button class="open-fullpage-btn" id="openHighlightsFullpage" title="Open in full page">
            <img src="icons/external-link.svg" alt="Open in full page">
          </button>
        </div>
        <div class="items-list" id="highlightsList">
          <!-- Highlights will be rendered here -->
        </div>
        <div class="empty-state hidden" id="highlightsEmpty">
          <img src="icons/notebook-text.svg" alt="">
          <p>No highlights yet</p>
          <small>Highlight text to save one</small>
        </div>
      </div>
    </div>

    <div class="popup-footer">
      <button id="settingsBtn" class="settings-link">
        <img src="icons/settings.svg" alt="Settings">
        Settings
      </button>
    </div>
  </div>

  <!-- Loading Progress Modal -->
  <div id="loadingModal" class="modal hidden">
    <div class="modal-content loading-content">
      <div class="loading-header">
        <div class="loading-spinner"></div>
        <h2 id="loadingTitle">Creating Flashcard...</h2>
      </div>
      <div class="loading-body">
        <div class="progress-steps">
          <div class="progress-step" id="step1">
            <div class="step-icon">01</div>
            <div class="step-info">
              <div class="step-title">Preparing</div>
              <div class="step-status">Getting ready...</div>
            </div>
          </div>
          <div class="progress-step" id="step2">
            <div class="step-icon">02</div>
            <div class="step-info">
              <div class="step-title">AI Processing</div>
              <div class="step-status">Waiting...</div>
            </div>
          </div>
          <div class="progress-step" id="step3">
            <div class="step-icon">03</div>
            <div class="step-info">
              <div class="step-title">Saving</div>
              <div class="step-status">Waiting...</div>
            </div>
          </div>
        </div>
        <div class="loading-text" id="loadingText"></div>
      </div>
    </div>
  </div>

  <!-- AI Preview Modal (from context menu) -->
  <div id="previewModal" class="modal hidden">
    <div class="modal-content preview-modal-content">
      <div class="preview-modal-header">
        <h2>AI Preview</h2>
        <button id="closePreviewModal" class="modal-close-btn">×</button>
      </div>
      <div class="preview-modal-body" id="previewModalBody">
        <!-- Rendered AI preview HTML -->
      </div>
      <div class="preview-modal-actions">
        <button id="saveFromPreviewBtn" class="button primary">Save as Flashcard</button>
        <button id="dismissPreviewBtn" class="button secondary">Dismiss</button>
      </div>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
