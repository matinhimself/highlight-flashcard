<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lexis</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="popup-header">
      <h1>Lexis</h1>
      <p class="subtitle">AI-Powered Learning</p>
    </div>

    <div class="popup-content">
      <a href="flashcards.html" class="popup-card">
        <div class="card-icon">
          <img src="icons/book-marked.svg" alt="Flashcards">
        </div>
        <h2>Flashcards</h2>
        <p>Review your AI-generated flashcards</p>
        <span class="count-badge" id="flashcardCount">0</span>
      </a>

      <a href="highlights.html" class="popup-card">
        <div class="card-icon">
          <img src="icons/notebook-pen.svg" alt="Notes">
        </div>
        <h2>Notes</h2>
        <p>Browse your highlights and notes</p>
        <span class="count-badge" id="highlightsCount">0</span>
      </a>
    </div>

    <div class="popup-footer">
      <button id="settingsBtn" class="settings-link">
        <img src="icons/settings.svg" alt="Settings">
        Settings
      </button>
    </div>
  </div>

  <!-- Loading Progress Modal -->
  <div id="loadingModal" class="modal hidden">
    <div class="modal-content loading-content">
      <div class="loading-header">
        <div class="loading-spinner"></div>
        <h2 id="loadingTitle">Creating Flashcard...</h2>
      </div>
      <div class="loading-body">
        <div class="progress-steps">
          <div class="progress-step" id="step1">
            <div class="step-icon">📝</div>
            <div class="step-info">
              <div class="step-title">Preparing</div>
              <div class="step-status">Getting ready...</div>
            </div>
          </div>
          <div class="progress-step" id="step2">
            <div class="step-icon">✨</div>
            <div class="step-info">
              <div class="step-title">AI Processing</div>
              <div class="step-status">Waiting...</div>
            </div>
          </div>
          <div class="progress-step" id="step3">
            <div class="step-icon">💾</div>
            <div class="step-info">
              <div class="step-title">Saving</div>
              <div class="step-status">Waiting...</div>
            </div>
          </div>
        </div>
        <div class="loading-text" id="loadingText"></div>
      </div>
    </div>
  </div>

  <!-- Success Modal -->
  <div id="successModal" class="modal hidden">
    <div class="modal-content success-content">
      <div class="success-header">
        <div class="success-icon">✓</div>
        <h2>Flashcard Created!</h2>
      </div>
      <div class="success-body">
        <p>Your flashcard has been successfully created.</p>
        <div class="success-actions">
          <button id="viewFlashcardsBtn" class="button primary">View Flashcards</button>
          <button id="closeSuccessBtn" class="button secondary">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
