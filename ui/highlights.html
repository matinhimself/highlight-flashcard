<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Highlights Notebook</title>
  <link rel="stylesheet" href="flashcards.css">
  <link rel="stylesheet" href="highlights.css">
  <script src="../lib/lucide.min.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-content">
        <h1><i data-lucide="notebook-pen" class="header-icon"></i> Lexis Notebook <span id="highlightsCount" class="count-badge">0</span></h1>
        <div class="header-actions">
          <button id="flashcardsBtn" class="icon-button" title="Go to Flashcards">
            <i data-lucide="book-marked"></i>
          </button>
          <button id="settingsBtn" class="icon-button" title="Settings">
            <i data-lucide="settings"></i>
          </button>
        </div>
      </div>
    </header>

    <div class="toolbar">
      <div class="search-container">
        <i data-lucide="search" class="search-icon"></i>
        <input type="text" id="searchInput" placeholder="Search highlights..." />
        <button id="clearSearch" class="clear-btn hidden">
          <i data-lucide="x"></i>
        </button>
      </div>

      <div class="toolbar-actions">
        <select id="filterSelect">
          <option value="all">All Highlights</option>
          <option value="described">With Description</option>
          <option value="simple">Simple Highlights</option>
        </select>
        <select id="sortSelect">
          <option value="newest">Newest First</option>
          <option value="oldest">Oldest First</option>
        </select>
      </div>
    </div>

    <main id="mainContent">
      <!-- Empty state -->
      <div id="emptyState" class="empty-state hidden">
        <i data-lucide="notebook-text" class="empty-icon"></i>
        <h2>No highlights yet</h2>
        <p>Highlight text on any webpage and select "Save to Notebook" or "Describe" to get started.</p>
      </div>

      <!-- Highlights list -->
      <div id="highlightsList" class="highlights-list"></div>

      <!-- Load more button -->
      <div id="loadMoreContainer" class="load-more-container hidden">
        <button id="loadMoreBtn" class="button secondary">Load More</button>
      </div>
    </main>
  </div>

  <!-- Edit Modal -->
  <div id="editModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Edit Highlight</h2>
        <button class="close-btn" id="closeModal">
          <i data-lucide="x"></i>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="editText">Highlighted Text</label>
          <textarea id="editText" rows="4"></textarea>
        </div>
        <div class="form-group" id="descriptionGroup">
          <label for="editDescription">Description</label>
          <textarea id="editDescription" rows="6"></textarea>
        </div>
        <div class="form-group">
          <label for="editSource">Source URL</label>
          <input type="text" id="editSource" />
        </div>
        <div class="form-group">
          <label for="editSourceTitle">Source Title</label>
          <input type="text" id="editSourceTitle" />
        </div>
      </div>
      <div class="modal-footer">
        <button id="cancelEdit" class="button secondary">Cancel</button>
        <button id="saveEdit" class="button primary">Save Changes</button>
      </div>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div id="deleteModal" class="modal hidden">
    <div class="modal-content small">
      <div class="modal-header">
        <h2>Delete Highlight?</h2>
        <button class="close-btn" id="closeDeleteModal">
          <i data-lucide="x"></i>
        </button>
      </div>
      <div class="modal-body">
        <p>Are you sure you want to delete this highlight?</p>
        <p class="warning-text">This cannot be undone.</p>
      </div>
      <div class="modal-footer">
        <button id="cancelDelete" class="button secondary">Cancel</button>
        <button id="confirmDelete" class="button danger">Delete</button>
      </div>
    </div>
  </div>

  <script type="module" src="highlights.js"></script>
</body>
</html>
