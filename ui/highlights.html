<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Highlights Notebook</title>
  <link rel="stylesheet" href="flashcards.css">
  <link rel="stylesheet" href="highlights.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="header-content">
        <h1><img src="icons/notebook-pen.svg" class="header-icon" alt=""> Lexis Notebook <span id="highlightsCount" class="count-badge">0</span></h1>
        <div class="header-actions">
          <button id="flashcardsBtn" class="icon-button" title="Go to Flashcards">
            <img src="icons/book-marked.svg" alt="Flashcards">
          </button>
          <button id="settingsBtn" class="icon-button" title="Settings">
            <img src="icons/settings.svg" alt="Settings">
          </button>
        </div>
      </div>
    </header>

    <div class="toolbar">
      <div class="search-container">
        <img src="icons/search.svg" class="search-icon" alt="">
        <input type="text" id="searchInput" placeholder="Search highlights..." />
        <button id="clearSearch" class="clear-btn hidden">
          <img src="icons/x.svg" alt="Clear">
        </button>
      </div>

      <div class="toolbar-actions">
        <!-- Custom Tag Selector Dropdown -->
        <div class="custom-dropdown" id="tagDropdown">
          <button class="dropdown-toggle" id="tagToggle">
            <span class="dropdown-label">All Tags</span>
            <img src="icons/chevron-down.svg" class="dropdown-icon" alt="">
          </button>
          <div class="dropdown-menu hidden" id="tagMenu">
            <div class="dropdown-search">
              <input type="text" id="tagSearch" placeholder="Search tags..." />
            </div>
            <div class="dropdown-items" id="tagItems">
              <div class="dropdown-item active" data-value="all">All Tags</div>
            </div>
          </div>
        </div>

        <!-- Custom Sort Dropdown -->
        <div class="custom-dropdown" id="sortDropdown">
          <button class="dropdown-toggle" id="sortToggle">
            <span class="dropdown-label">Newest First</span>
            <img src="icons/chevron-down.svg" class="dropdown-icon" alt="">
          </button>
          <div class="dropdown-menu hidden" id="sortMenu">
            <div class="dropdown-items">
              <div class="dropdown-item active" data-value="newest">Newest First</div>
              <div class="dropdown-item" data-value="oldest">Oldest First</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <main id="mainContent">
      <!-- Empty state -->
      <div id="emptyState" class="empty-state hidden">
        <img src="icons/notebook-text.svg" class="empty-icon" alt="">
        <h2>No highlights yet</h2>
        <p>Highlight text on any webpage and select "Save to Notebook" or "Describe" to get started.</p>
      </div>

      <!-- Highlights list -->
      <div id="highlightsList" class="highlights-list"></div>

      <!-- Load more button -->
      <div id="loadMoreContainer" class="load-more-container hidden">
        <button id="loadMoreBtn" class="button secondary">Load More</button>
      </div>
    </main>
  </div>

  <!-- Edit Modal -->
  <div id="editModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Edit Highlight</h2>
        <button class="close-btn" id="closeModal">
          <img src="icons/x.svg" alt="Close">
        </button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="editText">Highlighted Text</label>
          <textarea id="editText" rows="4"></textarea>
        </div>
        <div class="form-group" id="descriptionGroup">
          <label for="editDescription">Description</label>
          <textarea id="editDescription" rows="6"></textarea>
        </div>
        <div class="form-group">
          <label for="editSource">Source URL</label>
          <input type="text" id="editSource" />
        </div>
        <div class="form-group">
          <label for="editSourceTitle">Source Title</label>
          <input type="text" id="editSourceTitle" />
        </div>
      </div>
      <div class="modal-footer">
        <button id="cancelEdit" class="button secondary">Cancel</button>
        <button id="saveEdit" class="button primary">Save Changes</button>
      </div>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div id="deleteModal" class="modal hidden">
    <div class="modal-content small">
      <div class="modal-header">
        <h2>Delete Highlight?</h2>
        <button class="close-btn" id="closeDeleteModal">
          <img src="icons/x.svg" alt="Close">
        </button>
      </div>
      <div class="modal-body">
        <p>Are you sure you want to delete this highlight?</p>
        <p class="warning-text">This cannot be undone.</p>
      </div>
      <div class="modal-footer">
        <button id="cancelDelete" class="button secondary">Cancel</button>
        <button id="confirmDelete" class="button danger">Delete</button>
      </div>
    </div>
  </div>

  <script type="module" src="highlights.js"></script>
</body>
</html>
